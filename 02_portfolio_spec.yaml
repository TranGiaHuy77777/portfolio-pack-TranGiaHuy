    - React
    - Redux
    - JavaScript
    - TypeScript
    - TailwindCSS
    - Bootstrap

  backend:
    - Java
    - NodeJS

  tools:
    - Github
    - Vite
    - VSCode
    - Postman
    - Figma

  ai:
    - Claude
    - Antigravity
    - Copilot
    - Codex

