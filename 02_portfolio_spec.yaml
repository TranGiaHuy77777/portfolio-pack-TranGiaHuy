project:
  type: portfolio

  objective:
    - impress_recruiters
    - attract_clients
    - showcase_product_mindset
    - showcase_engineering_quality

profile:
  role: Fullstack Developer

  positioning:
    Frontend-focused

branding:
  theme: dark

  mood:
    - premium
    - elegant
    - modern

  inspiration:
    - apple
    - stripe
    - linear
    - vercel

